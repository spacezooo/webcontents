<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>if-else</title>
    </head>
    <body>
        <h3>if-else를 이용한 학점 매기기</h3>
        <hr>
        <script>
            let grade;
            let score = prompt("황기태님 점수를 입력하세요", 100);
            score = parseInt(score); // 문자열을 숫자로 바꿈

            if () 
                grade = "";

            else if () 
                grade = "cn";
            else if () 
                grade = "D";
            else if () 
                grade = "D";
            else  // 60미만
                grade = "F";
            

            document.write(score + "는 " + grade + "입니다.<br>");
        </script>
    </body>
</html>
